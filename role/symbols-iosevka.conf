<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Preserve each family's widths while preferring our adjusted version,
       including over copies installed by nerd-icons-install-fonts. -->
  <alias binding="strong">
    <family>Symbols Nerd Font</family>
    <prefer><family>Symbols Nerd Font ftzm</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Symbols Nerd Font Mono</family>
    <prefer><family>Symbols Nerd Font Mono ftzm</family></prefer>
  </alias>

  <!-- Keep Iosevka for text; use adjusted symbols when it lacks a glyph. -->
  <alias binding="strong">
    <family>Iosevka ftzm</family>
    <accept><family>Symbols Nerd Font Mono ftzm</family></accept>
  </alias>
  <alias binding="strong">
    <family>Iosevka ftzm Medium</family>
    <accept><family>Symbols Nerd Font Mono ftzm</family></accept>
  </alias>
</fontconfig>
