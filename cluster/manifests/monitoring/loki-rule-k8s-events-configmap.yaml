apiVersion: v1
data:
  k8s-events.yaml: |-
    "groups":
    - "name": "k8s-events"
      "rules":
      - "alert": "K8sEventWarning"
        "annotations":
          "description": "Warning-type events (OOMKill, FailedScheduling, eviction, probe failure) in the last 5m. Details: query the events stream in Loki."
          "summary": "Kubernetes warning events in {{ $labels.namespace }}"
        "expr": "sum by (namespace) (count_over_time({job=\"loki.source.kubernetes_events.cluster\"} |= \"Warning\" [5m])) > 0"
        "for": "1m"
        "labels":
          "severity": "warning"
kind: ConfigMap
metadata:
  annotations:
    k8s-sidecar-target-directory: /rules/fake
  labels:
    loki_rule: "1"
  name: loki-rule-k8s-events
  namespace: monitoring
