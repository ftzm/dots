apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: kube-prometheus-stack
  name: comin
  namespace: monitoring
spec:
  groups:
  - name: comin
    rules:
    - alert: CominDeploymentFailed
      annotations:
        description: A machine has not successfully deployed its configuration. Check
          `journalctl -u comin` on {{ $labels.instance }}.
        summary: comin deploy failing on {{ $labels.instance }}
      expr: comin_last_deployment_failed == 1
      for: 5m
      labels:
        severity: critical
    - alert: CominFetchFailed
      annotations:
        description: git fetch from origin has been failing for 1h (1h grace for transient
          network loss).
        summary: comin fetch failing on {{ $labels.instance }}
      expr: comin_last_fetch_failed == 1
      for: 1h
      labels:
        severity: warning
    - alert: CominTargetUnreachable
      annotations:
        description: Prometheus cannot scrape the comin exporter on an always-on lab
          machine. Every other Comin* alert is blind while this is true, so a deploy
          failure here would go unnoticed. Check host reachability over the LAN and
          that the exporter is listening on a routable address.
        summary: comin metrics unreachable on {{ $labels.instance }} for 30m
      expr: up{job="comin", instance=~"nuc|nas"} == 0
      for: 30m
      labels:
        severity: warning
    - alert: CominTargetStale
      annotations:
        description: 'A roaming machine has not been scraped successfully once in
          seven days: either it has been off that whole time or its exporter is broken.
          Either way every other Comin* alert is blind for it, so a deploy failure
          would go unnoticed. Expect this after a long trip; otherwise check tailscale
          reachability and the exporter.'
        summary: comin metrics stale on {{ $labels.instance }} for 7d
      expr: max_over_time(up{job="comin", instance=~"saoiste|eachtrai"}[7d]) == 0
      for: 1h
      labels:
        severity: warning
    - alert: OutdatedKernelNeedsReboot
      annotations:
        description: '{{ $labels.instance }} booted kernel {{ $labels.booted_kernel
          }} but its deployed configuration ships {{ $labels.current_kernel }} ({{
          $labels.reason }} differs). Config changes deploy live; a kernel cannot,
          so this needs a manual reboot and will not clear on its own. Until then
          the machine runs the older kernel and misses its security fixes.'
        summary: '{{ $labels.instance }} is running an outdated kernel - reboot to
          pick it up'
      expr: nixos_reboot_required{reason=~"kernel|initrd"} == 1
      for: 1h
      labels:
        severity: warning
    - alert: DeferredSwitchNeedsReboot
      annotations:
        description: '{{ $labels.instance }} installed its deployed system as the
          boot default but could not activate it live (a switch inhibitor changed,
          or the new systemd cannot replace the running one). It keeps running the
          previous system -- no config change since applies -- until a manual reboot.
          This will not clear on its own.'
        summary: '{{ $labels.instance }} has a deployed system waiting for a reboot'
      expr: nixos_reboot_required{reason="deferred"} == 1
      for: 1h
      labels:
        severity: warning
    - alert: RoamingNodeExporterDown
      annotations:
        description: '{{ $labels.instance }} answers on its comin exporter but not
          on node_exporter (:9002) for 30m, so every node metric for it -- reboot-needed,
          units, the manual-path self-tests -- is missing. Check `systemctl status
          prometheus-node-exporter` on {{ $labels.instance }}.'
        summary: node_exporter on {{ $labels.instance }} unreachable while the host
          is up
      expr: up{job="node-exporter", instance=~"saoiste|eachtrai"} == 0 and on(instance)
        up{job="comin"} == 1
      for: 30m
      labels:
        severity: warning
