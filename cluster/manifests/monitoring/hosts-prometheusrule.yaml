apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: kube-prometheus-stack
  name: hosts
  namespace: monitoring
spec:
  groups:
  - name: hosts
    rules:
    - alert: HostUnreachable
      annotations:
        description: Prometheus cannot scrape node_exporter on an always-on lab machine.
          Every host alert for it -- deploys, reboot need, units -- is blind while
          this is true. Check host reachability over the LAN and that node_exporter
          listens on :9002.
        summary: node_exporter on {{ $labels.instance }} unreachable for 30m
      expr: up{job="node-exporter", instance=~"nuc|nas|pi"} == 0
      for: 30m
      labels:
        severity: warning
    - alert: RoamingHostStale
      annotations:
        description: 'A roaming machine has not been scraped successfully once in
          seven days: either it has been off that whole time or its node_exporter
          is broken. Either way every host alert for it is blind, so a deploy failure
          would go unnoticed. Expect this after a long trip; otherwise check tailscale
          reachability and node_exporter.'
        summary: node_exporter on {{ $labels.instance }} not scraped for 7d
      expr: max_over_time(up{job="node-exporter", instance=~"saoiste|eachtrai"}[7d])
        == 0
      for: 1h
      labels:
        severity: warning
    - alert: OutdatedKernelNeedsReboot
      annotations:
        description: '{{ $labels.instance }} booted kernel {{ $labels.booted_kernel
          }} but its deployed configuration ships {{ $labels.current_kernel }} ({{
          $labels.reason }} differs). Config changes deploy live; a kernel cannot,
          so this needs a manual reboot and will not clear on its own. Until then
          the machine runs the older kernel and misses its security fixes.'
        summary: '{{ $labels.instance }} is running an outdated kernel - reboot to
          pick it up'
      expr: nixos_reboot_required{reason=~"kernel|initrd"} == 1
      for: 1h
      labels:
        severity: warning
    - alert: DeferredSwitchNeedsReboot
      annotations:
        description: '{{ $labels.instance }} installed its deployed system as the
          boot default but could not activate it live (a switch inhibitor changed,
          or the new systemd cannot replace the running one). It keeps running the
          previous system -- no config change since applies -- until a manual reboot.
          This will not clear on its own.'
        summary: '{{ $labels.instance }} has a deployed system waiting for a reboot'
      expr: nixos_reboot_required{reason="deferred", instance=~"saoiste|eachtrai"}
        == 1
      for: 1h
      labels:
        severity: warning
    - alert: DeferredSwitchRebootMissed
      annotations:
        description: '{{ $labels.instance }} has had a deployed system waiting for
          a reboot for 26h, past its nightly fleetAgent.autoReboot window. Either
          the reboot did not happen or the host did not come up as that system (the
          agent reboots once per path). Check `journalctl -u fleet-agent-reboot` and
          the boot entries on {{ $labels.instance }}.'
        summary: '{{ $labels.instance }} did not reboot into its deferred system'
      expr: nixos_reboot_required{reason="deferred", instance=~"nuc|nas|pi"} == 1
      for: 26h
      labels:
        severity: warning
    - alert: RoamingNodeExporterDown
      annotations:
        description: '{{ $labels.instance }} is online on the tailnet but its node_exporter
          (:9002) has not answered for 30m, so every node metric for it -- reboot-needed,
          deploys, the manual-path self-tests -- is missing. Check `systemctl status
          prometheus-node-exporter` on {{ $labels.instance }}.'
        summary: node_exporter on {{ $labels.instance }} unreachable while the host
          is up
      expr: up{job="node-exporter", instance=~"saoiste|eachtrai"} == 0 and on(instance)
        label_replace(fleet_tailnet_peer_online == 1, "instance", "$1", "host", "(.*)")
      for: 30m
      labels:
        severity: warning
