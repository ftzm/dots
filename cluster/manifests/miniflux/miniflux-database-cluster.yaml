apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: miniflux-database
  namespace: miniflux
spec:
  bootstrap:
    initdb:
      database: miniflux
      owner: miniflux
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    major: 18
    name: postgresql
  instances: 1
  storage:
    size: 5Gi
    storageClass: nfs
