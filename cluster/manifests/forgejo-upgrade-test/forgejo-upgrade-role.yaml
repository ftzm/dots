apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: forgejo-upgrade
  namespace: forgejo-upgrade-test
rules:
- apiGroups:
  - apps
  resourceNames:
  - forgejo
  resources:
  - deployments
  verbs:
  - get
  - patch
- apiGroups:
  - apps
  resourceNames:
  - forgejo
  resources:
  - deployments/scale
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
