apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
  name: temp-failing-hook
  namespace: forgejo-upgrade-test
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - echo "deliberate failure, no upgrade pending"; exit 1
        image: alpine/k8s:1.35.8
        name: fail
      restartPolicy: Never
