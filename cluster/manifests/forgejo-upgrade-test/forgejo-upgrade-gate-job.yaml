apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
  name: forgejo-upgrade-gate
  namespace: forgejo-upgrade-test
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - args:
        - |
          set -eu
          [ "$(cat /work/decision)" = preflight ] || exit 0
          if [ "$(cat /work/preflight)" != ok ]; then
            kubectl scale -n forgejo-upgrade-test deploy/forgejo --replicas=1
            echo "PRE-FLIGHT FAILED: forgejo $(cat /work/from) -> 16.0.3; the old version keeps serving"
            exit 1
          fi
          sed -i 's/ preflight$/ rollout/' /backup/.upgrade-attempt
          echo "pre-flight passed: rolling out 16.0.3"
        command:
        - /bin/bash
        - -c
        image: alpine/k8s:1.35.8
        name: decide
        volumeMounts:
        - mountPath: /backup
          name: backup
        - mountPath: /work
          name: work
      initContainers:
      - args:
        - |
          set -eu
          echo skip > /work/decision
          if [ ! -f /data/gitea/gitea.db ]; then
            echo "no /data/gitea/gitea.db: fresh install, nothing to protect"
            exit 0
          fi
          # Tolerate a pod still rolling from an earlier attempt; being
          # unable to ask is not an answer.
          deadline=$(( $(date +%s) + 300 ))
          until curl -sf http://forgejo:3000/api/v1/version >/dev/null 2>&1; do
            [ "$(date +%s)" -lt "$deadline" ] || { echo "FATAL: forgejo did not answer within 300s"; exit 1; }
            echo "waiting for forgejo to answer..."; sleep 5
          done
          # The API reports e.g. 16.0.5+gitea-1.22.0; the image tag is 16.0.5.
          from=$(curl -sf http://forgejo:3000/api/v1/version | jq -r '.version | split("+")[0]')
          if [ "$from" = "16.0.3" ]; then
            echo "forgejo $from matches the image: no upgrade pending"
            exit 0
          fi
          enabled=$(kubectl get application -n argocd forgejo-upgrade-test -o jsonpath='{.spec.syncPolicy.automated.enabled}')
          if [ "$enabled" = "false" ]; then
            echo "LOCKED: upgrade $from -> 16.0.3 is locked (automated sync disabled after a failed upgrade); see the Restore Runbook -> Forgejo upgrade lock"
            exit 1
          fi
          # The baseline: which doctor checks fail on the running version.
          # Before the marker, so a failure here locks nothing.
          set -o pipefail
          kubectl exec -n forgejo-upgrade-test deploy/forgejo -c forgejo -- \
            su-exec git forgejo doctor check --all --config /data/gitea/conf/app.ini 2>&1 \
            | tr -d '\033' | sed 's/\[[0-9;]*m//g' | awk '/^\[[0-9]+\] /{t=$0; sub(/^\[[0-9]+\] /,"",t)} /^ERROR$/{print t}' > /work/baseline
          echo "baseline (checks failing on $from): $(tr '\n' ';' < /work/baseline)"

          snap=/backup/forgejo-preupgrade-$from-to-16.0.3-$(date +%Y%m%d-%H%M%S).tar.gz
          cp /work/baseline /backup/.upgrade-baseline
          echo "$from 16.0.3 $snap preflight" > /backup/.upgrade-attempt
          echo "$from" > /work/from
          echo "UPGRADE: forgejo $from -> 16.0.3; marker written"

          # Stopped, so the snapshot is a point in time, not a live SQLite.
          kubectl scale -n forgejo-upgrade-test deploy/forgejo --replicas=0
          trap 'echo "gate failed after scale-down: restoring 1 replica"; kubectl scale -n forgejo-upgrade-test deploy/forgejo --replicas=1' ERR
          kubectl wait -n forgejo-upgrade-test --for=delete pod -l app.kubernetes.io/name=forgejo --timeout=300s
          tar -czf "$snap" -C /data .
          tar -tzf "$snap" >/dev/null
          echo "snapshot $snap: $(wc -c < "$snap") bytes, readable"
          tar -xzf "$snap" -C /scratch
          echo preflight > /work/decision
        command:
        - /bin/bash
        - -c
        image: alpine/k8s:1.35.8
        name: prepare
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /backup
          name: backup
        - mountPath: /work
          name: work
        - mountPath: /scratch
          name: scratch
      - args:
        - |
          set -u
          [ "$(cat /work/decision)" = preflight ] || exit 0
          not_in() { if [ -s "$1" ]; then grep -vxF -f "$1"; else cat; fi; }
          doctor_ok() {
            local out errs new
            out=$(set -o pipefail; su-exec git forgejo doctor check --all --config "$1" 2>&1 | tr -d '\033' | sed 's/\[[0-9;]*m//g') || {
              echo "$out"; echo "doctor: aborted (paths check failed)"; return 1; }
            echo "$out"
            echo "$out" | grep -q '^All done' || { echo "doctor: did not complete"; return 1; }
            if echo "$out" | grep -qE '^FAIL$|Error whilst initializing'; then
              echo "doctor: could not initialize or a check aborted"; return 1
            fi
            errs=$(echo "$out" | tr -d '\033' | sed 's/\[[0-9;]*m//g' | awk '/^\[[0-9]+\] /{t=$0; sub(/^\[[0-9]+\] /,"",t)} /^ERROR$/{print t}')
            new=$(printf '%s\n' "$errs" | grep -v '^$' | not_in "$2" || true)
            if [ -n "$new" ]; then echo "doctor: now failing, passed before: $new"; return 1; fi
            echo "doctor: no check fails that passed before"
          }

          if su-exec git forgejo migrate --config /data/gitea/conf/app.ini \
             && doctor_ok /data/gitea/conf/app.ini /backup/.upgrade-baseline; then
            echo ok > /work/preflight
          else
            echo failed > /work/preflight
          fi
        command:
        - /bin/bash
        - -c
        image: codeberg.org/forgejo/forgejo:16.0.3
        name: preflight
        volumeMounts:
        - mountPath: /data
          name: scratch
        - mountPath: /backup
          name: backup
        - mountPath: /work
          name: work
      restartPolicy: Never
      serviceAccountName: forgejo-upgrade
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: forgejo-data
      - name: backup
        persistentVolumeClaim:
          claimName: forgejo-backup
      - emptyDir: {}
        name: work
      - emptyDir: {}
        name: scratch
