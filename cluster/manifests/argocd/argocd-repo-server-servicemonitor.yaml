apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: argocd-repo-server
  namespace: argocd
spec:
  endpoints:
  - interval: 30s
    path: /metrics
    port: http-metrics
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server-metrics
