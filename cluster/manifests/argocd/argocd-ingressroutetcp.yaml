apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: argocd
  namespace: argocd
spec:
  entryPoints:
  - privatesecure
  - wgsecure
  routes:
  - match: HostSNI(`argo.lan.ftzmlab.xyz`)
    services:
    - name: argocd-server
      port: 443
  tls:
    passthrough: true
