apiVersion: v1
data:
  journal.yaml: |-
    "groups":
    - "name": "journal"
      "rules":
      - "alert": "JournalUnitFailure"
        "annotations":
          "description": "Unit {{ $labels.unit }} on {{ $labels.host }} logged a failure in the last 5m. Details: query the journal stream in Loki."
          "summary": "Systemd unit failed on {{ $labels.host }}"
        "expr": "sum by (host, unit) (count_over_time({job=\"systemd-journal\"} |~ \"entered failed state|Failed to start|Failed with result\" [5m])) > 0"
        "for": "1m"
        "labels":
          "severity": "warning"
      - "alert": "JournalNonCanonicalLevel"
        "annotations":
          "description": "A host is shipping journal lines with levels outside the canonical vocabulary — its log pipeline is running a stale or divergent config. Compare the deployed generation with the shipper process start time."
          "summary": "Non-canonical journal levels from {{ $labels.host }}"
        "expr": "sum by (host) (count_over_time({job=\"systemd-journal\", level!~\"debug|info|warn|error|fatal|unknown\"}[15m])) > 0"
        "for": "15m"
        "labels":
          "severity": "warning"
      - "alert": "JournalErrorRate"
        "annotations":
          "description": "Error lines are being emitted at > 0.05 lines/s over 5m. Threshold tuned against the real err-line baseline (k3s/NetworkManager emit err lines routinely)."
          "summary": "Elevated error rate in journal on {{ $labels.host }} ({{ $labels.unit }})"
        "expr": "sum by (host, unit) (rate({job=\"systemd-journal\",level=\"err\"}[5m])) > 0.05"
        "for": "10m"
        "labels":
          "severity": "warning"
kind: ConfigMap
metadata:
  annotations:
    k8s-sidecar-target-directory: /rules/fake
  labels:
    loki_rule: "1"
  name: loki-rule-journal
  namespace: monitoring
