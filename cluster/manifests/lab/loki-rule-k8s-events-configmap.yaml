apiVersion: v1
data:
  k8s-events.yaml: |-
    "groups":
    - "name": "k8s-events"
      "rules":
      - "alert": "K8sEventWarning"
        "annotations":
          "description": "A Warning-type event (OOMKill, FailedScheduling, eviction, probe failure). Full event text is in the alert body."
          "summary": "Kubernetes warning event"
        "expr": "{job=\"loki.source.kubernetes_events.cluster\"} |= \"Warning\""
        "for": "1m"
        "labels":
          "severity": "warning"
kind: ConfigMap
metadata:
  annotations:
    k8s-sidecar-target-directory: /rules/fake
  labels:
    loki_rule: "1"
  name: loki-rule-k8s-events
  namespace: monitoring
