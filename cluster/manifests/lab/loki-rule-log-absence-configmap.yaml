apiVersion: v1
data:
  log-absence.yaml: |-
    "groups":
    - "name": "log-absence"
      "rules":
      - "alert": "LogAbsenceTraefik"
        "annotations":
          "description": "The traefik log stream has gone silent — a dead service, or a broken log pipeline."
          "summary": "No logs from traefik for 1h"
        "expr": "absent_over_time({namespace=\"traefik\"}[1h])"
        "for": "30m"
        "labels":
          "severity": "warning"
      - "alert": "LogAbsenceBlocky"
        "annotations":
          "description": "The blocky log stream has gone silent — a dead service, or a broken log pipeline."
          "summary": "No logs from blocky for 1h"
        "expr": "absent_over_time({namespace=\"blocky\"}[1h])"
        "for": "30m"
        "labels":
          "severity": "warning"
      - "alert": "LogAbsenceArgocd"
        "annotations":
          "description": "The argocd log stream has gone silent — a dead service, or a broken log pipeline."
          "summary": "No logs from argocd for 1h"
        "expr": "absent_over_time({namespace=\"argocd\"}[1h])"
        "for": "30m"
        "labels":
          "severity": "warning"
      - "alert": "LogAbsenceMonitoring"
        "annotations":
          "description": "The monitoring log stream has gone silent — a dead service, or a broken log pipeline."
          "summary": "No logs from monitoring for 1h"
        "expr": "absent_over_time({namespace=\"monitoring\"}[1h])"
        "for": "30m"
        "labels":
          "severity": "warning"
      - "alert": "JournalAbsenceNuc"
        "annotations":
          "description": "Host nuc has shipped no journal lines for an hour. This is the signal that was missing when nas went dark for 32 days."
          "summary": "No journal from nuc for 1h"
        "expr": "absent_over_time({job=\"systemd-journal\", host=\"nuc\"}[1h])"
        "for": "30m"
        "labels":
          "severity": "warning"
      - "alert": "JournalAbsenceNas"
        "annotations":
          "description": "Host nas has shipped no journal lines for an hour. This is the signal that was missing when nas went dark for 32 days."
          "summary": "No journal from nas for 1h"
        "expr": "absent_over_time({job=\"systemd-journal\", host=\"nas\"}[1h])"
        "for": "30m"
        "labels":
          "severity": "warning"
kind: ConfigMap
metadata:
  annotations:
    k8s-sidecar-target-directory: /rules/fake
  labels:
    loki_rule: "1"
  name: loki-rule-log-absence
  namespace: monitoring
