apiVersion: v1
data:
  config.alloy: |-
    // Discover all pods
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Relabel to extract useful Kubernetes labels
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // Keep only running pods
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Pending|Succeeded|Failed|Completed"
        action        = "drop"
      }

      // Set namespace label
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      // Set pod label
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      // Set container label
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // Set node label
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }

      // Set app label from pod labels (common conventions)
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
    }

    // Collect logs from pods
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.default.receiver]
    }
    loki.process "default" {
      forward_to = [loki.write.default.receiver]
      stage.match {
        selector = "{namespace=~\"traefik|miniflux|cnpg-system|postgres|nextcloud|homepage|pinepods|atuin\"}"
        stage.json { expressions = { level = "level", message = "message", msg = "msg" } }
      }

      stage.match {
        selector = "{namespace=\"immich\", container!~\"valkey|redis\"}"
        stage.json { expressions = { level = "level", message = "message", msg = "msg" } }
      }

      stage.match {
        selector = "{namespace=~\"argocd|monitoring\"}"
        stage.logfmt { mapping = { level = "level", message = "message", msg = "msg" } }
      }

      stage.match {
        selector = "{namespace=~\"media|vaultwarden|kube-system|blocky\"}"
        stage.regex { expression = "^\\[[^\\]]*\\]\\s*\\[(?P<level>(DEBUG|INFO|WARN|WARNING|ERROR|FATAL))\\]" }
      }

      stage.match {
        selector = "{namespace=\"ntfy\"}"
        stage.regex { expression = "^(?P<level>(DEBUG|INFO|WARN|WARNING|ERROR|FATAL))\\b" }
      }

      stage.match {
        selector = "{namespace=~\"gitea|forgejo\"}"
        stage.regex { expression = "^\\[(?P<level>[IWEF])\\]" }
      }

      stage.match {
        selector = "{namespace=\"immich\", container=~\"valkey|redis\"}"
        stage.regex { expression = "^[^ ]+ +[0-9]+ [^ ]+ +[0-9:.]+ (?P<level>[.\\-*#])" }
      }
      stage.template {
        source   = "level"
        template = "{{ $lvl := ToLower .Value }}{{ if or (eq $lvl \"debug\") (eq $lvl \".\") }}debug{{ else if or (eq $lvl \"info\") (eq $lvl \"i\") (eq $lvl \"notice\") (eq $lvl \"normal\") (eq $lvl \"-\") (eq $lvl \"*\") }}info{{ else if or (eq $lvl \"warn\") (eq $lvl \"warning\") (eq $lvl \"w\") (eq $lvl \"#\") }}warn{{ else if or (eq $lvl \"error\") (eq $lvl \"err\") (eq $lvl \"e\") }}error{{ else if or (eq $lvl \"fatal\") (eq $lvl \"f\") (eq $lvl \"crit\") (eq $lvl \"alert\") (eq $lvl \"emerg\") }}fatal{{ else }}unknown{{ end }}"
      }
      stage.labels {
        values = { level = "" }
      }
    }

    // Collect host journal logs
    loki.source.journal "host" {
      path          = "/var/log/journal"
      relabel_rules = discovery.relabel.journal.rules
      forward_to    = [loki.write.default.receiver]
      labels        = { job = "systemd-journal" }
    }

    discovery.relabel "journal" {
      targets = []
      rule {
        source_labels = ["__journal__systemd_unit"]
        target_label  = "unit"
      }
      rule {
        source_labels = ["__journal__hostname"]
        target_label  = "host"
      }
      rule {
        source_labels = ["__journal_syslog_identifier"]
        target_label  = "syslog_identifier"
      }
      rule {
        source_labels = ["__journal_priority_keyword"]
        regex         = ".*"
        target_label  = "level"
        replacement   = "unknown"
      }
      rule {
        source_labels = ["__journal_priority_keyword"]
        regex         = "debug"
        target_label  = "level"
        replacement   = "debug"
      }
      rule {
        source_labels = ["__journal_priority_keyword"]
        regex         = "info|notice"
        target_label  = "level"
        replacement   = "info"
      }
      rule {
        source_labels = ["__journal_priority_keyword"]
        regex         = "warning|warn"
        target_label  = "level"
        replacement   = "warn"
      }
      rule {
        source_labels = ["__journal_priority_keyword"]
        regex         = "err|error"
        target_label  = "level"
        replacement   = "error"
      }
      rule {
        source_labels = ["__journal_priority_keyword"]
        regex         = "crit|alert|emerg"
        target_label  = "level"
        replacement   = "fatal"
      }
    }

    // friendlywrt (OpenWrt) host syslog over TCP. Collected here
    // because OpenWrt has no systemd/journal — this is the only
    // visibility into the k3s agent / sysntpd / firewall on that
    // box (the NodeClockNotSynchronising incident's host).
    loki.source.syslog "friendlywrt" {
      listener {
        address  = "0.0.0.0:5140"
        protocol = "tcp"
      }
      relabel_rules = discovery.relabel.syslog.rules
      forward_to    = [loki.write.default.receiver]
      labels        = { job = "syslog", host = "friendlywrt" }
    }

    // Same canonical level vocabulary as the journal and the pod
    // pipeline — otherwise friendlywrt logs arrive with no level at
    // all and are invisible to both level-based alerts and the
    // ParseCoverage guard.
    discovery.relabel "syslog" {
      targets = []
      rule {
        source_labels = ["__syslog_message_app_name"]
        target_label  = "syslog_identifier"
      }
      rule {
        source_labels = ["__syslog_message_severity"]
        regex         = ".*"
        target_label  = "level"
        replacement   = "unknown"
      }
      rule {
        source_labels = ["__syslog_message_severity"]
        regex         = "debug"
        target_label  = "level"
        replacement   = "debug"
      }
      rule {
        source_labels = ["__syslog_message_severity"]
        regex         = "info|notice"
        target_label  = "level"
        replacement   = "info"
      }
      rule {
        source_labels = ["__syslog_message_severity"]
        regex         = "warning|warn"
        target_label  = "level"
        replacement   = "warn"
      }
      rule {
        source_labels = ["__syslog_message_severity"]
        regex         = "err|error"
        target_label  = "level"
        replacement   = "error"
      }
      rule {
        source_labels = ["__syslog_message_severity"]
        regex         = "crit|alert|emerg"
        target_label  = "level"
        replacement   = "fatal"
      }
    }


    // Kubernetes events (OOMKill, FailedScheduling, evictions) —
    // today's biggest blind spot. The alloy chart's ClusterRole
    // grants NO events access (verified: zero `events` rules in
    // charts/alloy/templates/rbac.yaml), so the supplementary
    // ClusterRole below is what makes this component work at all.
    loki.source.kubernetes_events "cluster" {
      forward_to = [loki.write.default.receiver]
    }

    // Write logs to Loki
    loki.write "default" {
      endpoint {
        url = "http://loki-gateway.monitoring.svc.cluster.local:80/loki/api/v1/push"
      }
    }

    // OTLP receiver for traces from instrumented apps
    otelcol.receiver.otlp "default" {
      grpc { endpoint = "0.0.0.0:4317" }
      http { endpoint = "0.0.0.0:4318" }
      output {
        traces = [otelcol.processor.batch.default.input]
      }
    }

    // Batch processor for better performance
    otelcol.processor.batch "default" {
      output {
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    // Export traces to Tempo
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo.monitoring.svc.cluster.local:4317"
        tls { insecure = true }
      }
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: config
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/managed-by: Helmraiser
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy
    app.kubernetes.io/version: v1.18.0
    helm.sh/chart: alloy-1.11.0
  name: alloy
  namespace: monitoring
