apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanuparr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cleanuparr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cleanuparr
    spec:
      containers:
      - image: ghcr.io/cleanuparr/cleanuparr:2.10.8
        name: cleanuparr
        ports:
        - containerPort: 11011
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 11011
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /blocklists
          name: blocklists
          readOnly: true
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: cleanuparr-config
      - configMap:
          name: cleanuparr-blocklists
        name: blocklists
