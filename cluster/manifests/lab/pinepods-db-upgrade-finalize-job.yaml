apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: pinepods-db-upgrade-finalize
  namespace: pinepods
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - args:
        - |
          set -eu
          deadline=$(( $(date +%s) + 300 ))
          until psql -tAc 'SELECT 1' > /dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "FATAL: database did not accept connections within 300s; the check did not run"
              exit 1
            fi
            echo "waiting for the database to accept connections..."
            sleep 5
          done
          running=$(psql -tAc 'SHOW server_version_num' | tr -d '[:space:]')
          major=$(( running / 10000 ))
          marker="/backup/.pg-major-pinepods_database"
          if [ ! -f "$marker" ]; then
            echo "$major" > "$marker"
            echo "baseline recorded: PostgreSQL $major (nothing to finalize)"
            exit 0
          fi
          last=$(cat "$marker")
          if [ "$last" = "$major" ]; then
            echo "PostgreSQL major unchanged ($major) - nothing to finalize"
            exit 0
          fi
          echo "PostgreSQL major changed $last -> $major; finalizing"
          # pg_upgrade does not carry optimizer statistics across. Staged so the
          # database becomes usable quickly rather than after one long pass.
          vacuumdb --analyze-in-stages --dbname="$PGDATABASE"
          echo "$major" > "$marker"
          echo "finalized: statistics rebuilt for PostgreSQL $major"
        command:
        - /bin/sh
        - -c
        env:
        - name: PGHOST
          value: pinepods-database-rw
        - name: PGUSER
          value: postgres
        - name: PGDATABASE
          value: pinepods_database
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: pinepods-database-superuser
        image: ghcr.io/cloudnative-pg/postgresql:18.2
        name: pinepods-db-upgrade-finalize
        volumeMounts:
        - mountPath: /backup
          name: backup
      restartPolicy: Never
      securityContext:
        supplementalGroups:
        - 1001
      volumes:
      - name: backup
        persistentVolumeClaim:
          claimName: pinepods-db-backup
