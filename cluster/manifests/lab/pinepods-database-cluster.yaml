apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pinepods-database
  namespace: pinepods
spec:
  bootstrap:
    initdb:
      database: pinepods_database
      owner: pinepods
  enableSuperuserAccess: true
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    major: 18
    name: postgresql
  instances: 1
  storage:
    size: 5Gi
    storageClass: nfs
