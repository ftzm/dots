apiVersion: v1
data:
  lab.yml: "title: |\n  {{- $n := len .alerts }}\n  {{- $a := index .alerts 0 }}\n
    \ {{- if eq .status \"firing\" }}\U0001F6A8 {{ else }}✅ {{ end }}{{ index $a.labels
    \"alertname\" }}{{ if gt $n 1 }} (x{{ $n }}){{ end }}{{ if eq .status \"resolved\"
    }} resolved{{ end }}\nmessage: |\n  {{- range .alerts }}\n  {{- with .annotations.summary
    }}{{ . }}\n  {{ end }}\n  {{- with .annotations.description }}{{ . }}\n  {{ end
    }}\n  {{- $parts := list }}\n  {{- with index .labels \"host\" }}{{ $parts = append
    $parts . }}{{ end }}\n  {{- with index .labels \"instance\" }}{{ $parts = append
    $parts . }}{{ end }}\n  {{- with index .labels \"namespace\" }}{{ $parts = append
    $parts . }}{{ end }}\n  {{- with index .labels \"container\" }}{{ $parts = append
    $parts . }}{{ end }}\n  {{- with index .labels \"unit\" }}{{ $parts = append $parts
    . }}{{ end }}\n  {{- if $parts }}where: {{ join \" / \" $parts }}\n  {{ end }}\n
    \ {{- end }}\npriority: |\n  {{- if eq .status \"resolved\" }}2\n  {{- else if
    eq (index (index .alerts 0).labels \"severity\") \"critical\" }}5\n  {{- else
    }}3{{ end }}\n"
kind: ConfigMap
metadata:
  name: ntfy-templates
  namespace: ntfy
