apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: forgejo-backup-forgejo
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 10Gi
  nfs:
    path: /pool-1/k8s/forgejo-backup
    server: 192.168.1.3
  persistentVolumeReclaimPolicy: Retain
  storageClassName: forgejo-backup-forgejo
