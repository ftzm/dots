apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: forgejo-upgrade-syncfail
  namespace: forgejo
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - args:
        - |
          set -eu
          not_in() { if [ -s "$1" ]; then grep -vxF -f "$1"; else cat; fi; }

          if [ ! -e /backup/.upgrade-attempt ]; then
            echo "no upgrade in flight: not a failed upgrade, nothing to undo"
            exit 0
          fi
          read -r from to snap stage < /backup/.upgrade-attempt
          old=codeberg.org/forgejo/forgejo:$from
          echo "failed upgrade $from -> $to at stage $stage"
          # Lock first: selfHeal must not undo what follows, and every retry
          # must stop at the gate.
          kubectl patch application -n argocd forgejo --type merge -p '{"spec":{"syncPolicy":{"automated":{"enabled":false}}}}'
          echo "locked: automated sync disabled on forgejo"
          case "$stage" in
            preflight)
              # The new image never rolled; make sure the old one serves.
              kubectl scale -n forgejo deploy/forgejo --replicas=1
              ;;
            rollout)
              running=$(curl -sf http://forgejo:3000/api/v1/version | jq -r '.version | split("+")[0]' || true)
              if [ "$running" != "$from" ]; then
                kubectl scale -n forgejo deploy/forgejo --replicas=0
                kubectl wait -n forgejo --for=delete pod -l app.kubernetes.io/name=forgejo --timeout=300s
                find /data -mindepth 1 -maxdepth 1 -exec rm -rf {} +
                tar -xzf "$snap" -C /data
                echo "restored $snap into the data volume"
                kubectl set image -n forgejo deploy/forgejo forgejo="$old" bootstrap-admin="$old"
                kubectl scale -n forgejo deploy/forgejo --replicas=1
              fi
              deadline=$(( $(date +%s) + 600 ))
              until [ "$(curl -sf http://forgejo:3000/api/v1/version | jq -r '.version | split("+")[0]' 2>/dev/null)" = "$from" ]; do
                [ "$(date +%s)" -lt "$deadline" ] || { echo "FATAL: forgejo did not come back as $from"; exit 1; }
                sleep 5
              done
              kubectl exec -n forgejo deploy/forgejo -c forgejo -- \
                su-exec git forgejo doctor check --all --config /data/gitea/conf/app.ini 2>&1 \
                | tr -d '\033' | sed 's/\[[0-9;]*m//g' | awk '/^\[[0-9]+\] /{t=$0; sub(/^\[[0-9]+\] /,"",t)} /^ERROR$/{print t}' > /tmp/now
              if not_in /backup/.upgrade-baseline < /tmp/now | grep -q .; then
                echo "FATAL: restored $from fails doctor checks it passed before: $(not_in /backup/.upgrade-baseline < /tmp/now | tr '\n' ';')"
                exit 1
              fi
              echo "forgejo $from restored and passing"
              ;;
          esac
          rm -f /backup/.upgrade-attempt
          # Retries recreate this Job (and the gate) under the same names, so
          # its log does not survive; the history does, and the gate quotes
          # it while the lock holds.
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $from -> $to failed at $stage: rolled back to $from, forgejo locked" >> /backup/upgrade-history.log
          echo "ROLLED BACK: upgrade $from -> $to failed at $stage; forgejo serves $from, forgejo locked until lifted by hand"
          exit 1
        command:
        - /bin/bash
        - -c
        image: alpine/k8s:1.35.8
        name: rollback
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /backup
          name: backup
      restartPolicy: Never
      serviceAccountName: forgejo-upgrade
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: forgejo-data
      - name: backup
        persistentVolumeClaim:
          claimName: forgejo-backup
