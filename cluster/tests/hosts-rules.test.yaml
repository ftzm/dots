# Unit tests for the host reachability and reboot alerts. Run with `just test-rules`,
# which renders .spec out of the PrometheusRule CRs into tests/.rules/ first.
#
# The two rules split by host class: always-on lab machines alert on `up == 0`
# within 30m, roaming laptops only when nothing has been scraped for seven
# days. The laptop cases below pin the overnight absence that used to page.

rule_files:
  - .rules/hosts-prometheusrule.yaml

evaluation_interval: 1m

tests:
  # An always-on machine going quiet is a fault, on every such machine, and
  # not before its `for` elapses.
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter", instance="nuc"}'
        values: '0+0x60'
      - series: 'up{job="node-exporter", instance="nas"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: HostUnreachable
        exp_alerts: []
      - eval_time: 30m
        alertname: HostUnreachable
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              instance: nas
            exp_annotations:
              summary: 'node_exporter on nas unreachable for 30m'
              description: 'Prometheus cannot scrape node_exporter on an always-on lab machine. Every host alert for it -- deploys, reboot need, units -- is blind while this is true. Check host reachability over the LAN and that node_exporter listens on :9002.'
          - exp_labels:
              severity: warning
              job: node-exporter
              instance: nuc
            exp_annotations:
              summary: 'node_exporter on nuc unreachable for 30m'
              description: 'Prometheus cannot scrape node_exporter on an always-on lab machine. Every host alert for it -- deploys, reboot need, units -- is blind while this is true. Check host reachability over the LAN and that node_exporter listens on :9002.'

  # A laptop off overnight is not news: one scrape, then eleven hours away,
  # pages nothing. Under the old single `up == 0` rule this fired at 6h.
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter", instance="eachtrai"}'
        values: '1+0x60 0+0x660'
    alert_rule_test:
      - eval_time: 12h
        alertname: RoamingHostStale
        exp_alerts: []
      - eval_time: 12h
        alertname: HostUnreachable
        exp_alerts: []

  # A laptop that has not answered once in seven days is either gone or
  # broken; both make every host alert blind for it, so it pages.
  # Sampled every 30m: a week of 1m samples exceeds promtool's per-query
  # sample budget, and the rule's semantics do not depend on resolution.
  - interval: 30m
    input_series:
      - series: 'up{job="node-exporter", instance="saoiste"}'
        values: '1 0+0x384'
    alert_rule_test:
      # Still within seven days of the last successful scrape.
      - eval_time: 6d
        alertname: RoamingHostStale
        exp_alerts: []
      - eval_time: 7d2h
        alertname: RoamingHostStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              instance: saoiste
            exp_annotations:
              summary: 'node_exporter on saoiste not scraped for 7d'
              description: 'A roaming machine has not been scraped successfully once in seven days: either it has been off that whole time or its node_exporter is broken. Either way every host alert for it is blind, so a deploy failure would go unnoticed. Expect this after a long trip; otherwise check tailscale reachability and node_exporter.'
      - eval_time: 7d2h
        alertname: HostUnreachable
        exp_alerts: []

  # The reboot alert splits by reason: a kernel/initrd difference and a
  # deferred switch each get their own message.
  - interval: 1m
    input_series:
      - series: 'nixos_reboot_required{instance="nas", booted_kernel="6.12.1", current_kernel="6.12.2", reason="kernel"}'
        values: '1+0x70'
      - series: 'nixos_reboot_required{instance="eachtrai", booted_kernel="6.12.2", current_kernel="6.12.2", reason="deferred"}'
        values: '1+0x70'
      # An always-on host reboots itself in its nightly window: not news at 1h.
      - series: 'nixos_reboot_required{instance="nuc", booted_kernel="6.12.2", current_kernel="6.12.2", reason="deferred"}'
        values: '1+0x70'
      - series: 'nixos_reboot_required{instance="saoiste", booted_kernel="6.12.2", current_kernel="6.12.2", reason=""}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 61m
        alertname: OutdatedKernelNeedsReboot
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: nas
              booted_kernel: 6.12.1
              current_kernel: 6.12.2
              reason: kernel
            exp_annotations:
              summary: 'nas is running an outdated kernel - reboot to pick it up'
              description: 'nas booted kernel 6.12.1 but its deployed configuration ships 6.12.2 (kernel differs). Config changes deploy live; a kernel cannot, so this needs a manual reboot and will not clear on its own. Until then the machine runs the older kernel and misses its security fixes.'
      - eval_time: 61m
        alertname: DeferredSwitchNeedsReboot
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: eachtrai
              booted_kernel: 6.12.2
              current_kernel: 6.12.2
              reason: deferred
            exp_annotations:
              summary: 'eachtrai has a deployed system waiting for a reboot'
              description: 'eachtrai installed its deployed system as the boot default but could not activate it live (a switch inhibitor changed, or the new systemd cannot replace the running one). It keeps running the previous system -- no config change since applies -- until a manual reboot. This will not clear on its own.'
      - eval_time: 61m
        alertname: DeferredSwitchRebootMissed
        exp_alerts: []

  # A laptop's node_exporter down while nuc sees it on the tailnet pages after
  # 30m; down while it is off the tailnet too (asleep) does not.
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter", instance="eachtrai"}'
        values: '0+0x40'
      - series: 'fleet_tailnet_peer_online{job="node-exporter", instance="nuc", host="eachtrai"}'
        values: '1+0x40'
      - series: 'up{job="node-exporter", instance="saoiste"}'
        values: '0+0x40'
      - series: 'fleet_tailnet_peer_online{job="node-exporter", instance="nuc", host="saoiste"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 29m
        alertname: RoamingNodeExporterDown
        exp_alerts: []
      - eval_time: 30m
        alertname: RoamingNodeExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              instance: eachtrai
            exp_annotations:
              summary: 'node_exporter on eachtrai unreachable while the host is up'
              description: 'eachtrai is online on the tailnet but its node_exporter (:9002) has not answered for 30m, so every node metric for it -- reboot-needed, deploys, the manual-path self-tests -- is missing. Check `systemctl status prometheus-node-exporter` on eachtrai.'

  # An always-on host's deferred switch pages only once its nightly reboot
  # window has passed (26h). Sampled every 5m: a `for` needs every
  # evaluation to see a sample within the 5m lookback.
  - interval: 5m
    input_series:
      - series: 'nixos_reboot_required{instance="nuc", booted_kernel="6.12.2", current_kernel="6.12.2", reason="deferred"}'
        values: '1+0x320'
    alert_rule_test:
      - eval_time: 25h55m
        alertname: DeferredSwitchRebootMissed
        exp_alerts: []
      - eval_time: 26h5m
        alertname: DeferredSwitchRebootMissed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: nuc
              booted_kernel: 6.12.2
              current_kernel: 6.12.2
              reason: deferred
            exp_annotations:
              summary: 'nuc did not reboot into its deferred system'
              description: 'nuc has had a deployed system waiting for a reboot for 26h, past its nightly fleetAgent.autoReboot window. Either the reboot did not happen or the host did not come up as that system (the agent reboots once per path). Check `journalctl -u fleet-agent-reboot` and the boot entries on nuc.'
      - eval_time: 26h5m
        alertname: DeferredSwitchNeedsReboot
        exp_alerts: []
