name: Auto-fix flake update failures

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  auto-fix:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'update_flake_lock_action'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Find triggering PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          pr_number=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ github.event.workflow_run.head_branch }}" \
            --state open \
            --json number,labels \
            --jq '[.[] | select(.labels[].name == "automated")][0].number')
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "No automated PR found for branch ${{ github.event.workflow_run.head_branch }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Checkout failing commit
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Nix
        if: steps.pr.outputs.skip != 'true'
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Magic Nix cache
        if: steps.pr.outputs.skip != 'true'
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Collect failed CI logs
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p /tmp/ci
          gh run view ${{ github.event.workflow_run.id }} \
            --repo "${{ github.repository }}" \
            --log-failed > /tmp/ci/failed.log || true
          # Bound token usage by keeping only the tail
          tail -c 200000 /tmp/ci/failed.log > /tmp/ci/failed.trimmed.log
          mv /tmp/ci/failed.trimmed.log /tmp/ci/failed.log
          wc -l /tmp/ci/failed.log

      # Baseline for the outcome guard below: a run that neither opens a repair
      # PR nor says anything on the PR has done nothing, and must not report
      # success.
      - name: Snapshot PR comment count
        id: before
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          n=$(gh pr view "${{ steps.pr.outputs.pr_number }}" --json comments --jq '.comments | length')
          echo "comments=$n" >> "$GITHUB_OUTPUT"
          echo "baseline: $n comments"

      - name: Claude auto-fix
        if: steps.pr.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PAT_TOKEN }}
          prompt: |
            CI failed on the automated flake.lock update PR
            #${{ steps.pr.outputs.pr_number }} (branch
            `${{ github.event.workflow_run.head_branch }}`,
            commit ${{ github.event.workflow_run.head_sha }}).

            The failed CI log is at /tmp/ci/failed.log. Read it, diagnose the
            breakage caused by the new flake inputs, and fix the Nix config so
            each affected NixOS configuration builds again. Hosts built in CI:
            saoiste, eachtrai, nuc, nas. Verify locally with
            `nix build .#nixosConfigurations.<host>.config.system.build.toplevel`
            before opening the PR.

            Constraints:
            - Only adapt the config to upstream API changes. Do NOT add
              features, refactor unrelated code, or modify flake.lock.
            - If the failure is transient (network, cache, infra) and not a
              real config break, comment on the PR saying so and exit without
              opening a repair PR. Never exit silently: whatever you conclude,
              this run must leave either a repair PR or a comment behind.
            - Create a new branch off the current HEAD named
              `claude/fix-flake-update-${{ steps.pr.outputs.pr_number }}`.
            - Open a PR via `gh pr create` targeting
              `${{ github.event.workflow_run.head_branch }}` (NOT master), so
              merging the fix lets the existing flake-update PR pass CI and
              auto-merge.
            - Title: `fix: adapt config to flake.lock update (#${{ steps.pr.outputs.pr_number }})`
            - Body: short explanation of what upstream changed and what you
              changed in response.
          claude_args: |
            --max-turns 40
            --allowedTools Read,Edit,Write,Bash,Grep,Glob

      # The agent's own transcript is the only record of why it decided what it
      # decided; the job log keeps just the init and result envelopes.
      - name: Upload Claude transcript
        if: always() && steps.pr.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn

      - name: Require a visible outcome
        if: always() && steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          FIX_BRANCH: claude/fix-flake-update-${{ steps.pr.outputs.pr_number }}
          BEFORE: ${{ steps.before.outputs.comments }}
        run: |
          set -euo pipefail
          if [ -n "$(gh pr list --head "$FIX_BRANCH" --state all --json number --jq '.[0].number // empty')" ]; then
            echo "repair PR exists for $FIX_BRANCH"
            exit 0
          fi
          after=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments | length')
          if [ "$after" -gt "${BEFORE:-0}" ]; then
            echo "no repair PR, but the run explained itself on #$PR_NUMBER"
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body "Automated flake-update repair produced nothing: no \`$FIX_BRANCH\` branch and no explanation. CI on this PR is still red and needs a human. Transcript: the \`claude-execution-output\` artifact on [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          echo "::error::auto-fix left no repair PR and no comment on #$PR_NUMBER"
          exit 1
